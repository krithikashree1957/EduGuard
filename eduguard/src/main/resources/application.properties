```properties
spring.application.name=eduguard

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/eduguard_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Stage 5: Notification Configuration
eduguard.notifications.email-mode=${EDUGUARD_NOTIFICATION_EMAIL_MODE:mock}
eduguard.notifications.max-attempts=${EDUGUARD_NOTIFICATION_MAX_ATTEMPTS:3}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
eduguard.notifications.sender=${SMTP_SENDER:no-reply@eduguard.local}

# Stage 6: External Integrations
eduguard.integrations.academic.enabled=true
eduguard.integrations.academic.mode=mock
eduguard.integrations.academic.base-url=${EDUGUARD_ACADEMIC_BASE_URL:}
eduguard.integrations.academic.api-key=${EDUGUARD_ACADEMIC_API_KEY:}
eduguard.integrations.academic.connect-timeout=2s
eduguard.integrations.academic.read-timeout=3s

eduguard.integrations.wellbeing.enabled=true
eduguard.integrations.wellbeing.mode=mock
eduguard.integrations.wellbeing.base-url=${EDUGUARD_WELLBEING_BASE_URL:}
eduguard.integrations.wellbeing.api-key=${EDUGUARD_WELLBEING_API_KEY:}
eduguard.integrations.wellbeing.connect-timeout=2s
eduguard.integrations.wellbeing.read-timeout=3s
```
